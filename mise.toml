[tools]
cmake = "4.4.3"
ninja = "1.13.1"

[env]
BUILD_DIR = "build"

[tasks."setup:macos"]
description = "Install Qt development dependencies with Homebrew"
run = "brew install clang-format qtbase qtdeclarative qtshadertools qtsvg qtwebsockets"

[tasks.configure]
description = "Configure the Qt build"
run = '''
QT_PREFIX="${QT_PREFIX:-${QTDIR:-$(brew --prefix 2>/dev/null || true)}}"
cmake -S . -B "$BUILD_DIR" -G Ninja \
  ${QT_PREFIX:+-DCMAKE_PREFIX_PATH="$QT_PREFIX"} \
  -DCMAKE_BUILD_TYPE=Debug \
  -DBUILD_TESTING=ON \
  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
'''

[tasks.build]
description = "Build the application and tests"
depends = ["configure"]
run = "cmake --build \"$BUILD_DIR\" --parallel"

[tasks.test]
description = "Run headless foundation tests"
depends = ["build"]
env.QT_QPA_PLATFORM = "offscreen"
run = "ctest --test-dir \"$BUILD_DIR\" --output-on-failure"

[tasks."format:check"]
description = "Check C++ and QML formatting"
run = '''
find src src/domain tests tests/probes -maxdepth 1 -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
  | xargs -0 clang-format --dry-run --Werror
for file in qml/*.qml; do
  formatted="$(mktemp)"
  qmlformat "$file" > "$formatted"
  if ! cmp -s "$file" "$formatted"; then
    echo "$file is not formatted; run: qmlformat -i $file" >&2
    rm -f "$formatted"
    exit 1
  fi
  rm -f "$formatted"
done
'''

[tasks.lint]
description = "Run QML static analysis"
depends = ["configure"]
run = "qmllint -I \"$BUILD_DIR\" qml/*.qml"

[tasks."package:appimage"]
description = "Build a Linux x86_64 AppImage"
depends = ["build"]
run = "packaging/build-appimage.sh \"$BUILD_DIR\""

[tasks."contracts:verify-provenance"]
description = "Prove vendored contracts/ files are byte-identical to the pinned backend git commit (fetches from the real backend remote; not merely an offline digest re-check)"
run = "python3 packaging/verify_contract_provenance.py"

[tasks."contracts:test-provenance-script"]
description = "Unit-test verify_contract_provenance.py's closure discovery/verify() logic against an in-memory fake backend tree (no network access)"
run = "python3 packaging/verify_contract_provenance_test.py"

[tasks."contracts:check-encoder-hygiene"]
description = "Prove via real compiler-AST inspection (libclang) that no public declaration or #include anywhere across every registered domain/foundation header, fragment, and production source (parsed with its own exact compile command) returns a QJson/QVariant-JSON-container family type or crosses the domain->foundation dependency direction, except the 14 explicitly allowlisted canonical adapters/decode helpers. Configures its own dedicated Clang-toolchain build directory."
run = "python3 packaging/check_encoder_hygiene.py"

[tasks."contracts:test-encoder-hygiene-script"]
description = "Unit-test check_encoder_hygiene.py's classify()/allowlist/sanitize-args logic with synthetic data (no compiler invocation)"
run = "python3 packaging/check_encoder_hygiene_test.py"

[tasks."contracts:test-encoder-hygiene-ast-mutations"]
description = "Real libclang fail-before/pass-after mutation tests for check_encoder_hygiene.py's AST core: source-only encoder declarations, non-const output/inout parameters, base-class/using-declaration inheritance exposure, and inclusion-graph dependency-direction/system-header/external-root classification (bare/../absolute/symlink #include spellings). Requires a real libclang, same as contracts:check-encoder-hygiene."
run = "python3 packaging/check_encoder_hygiene_ast_test.py"
