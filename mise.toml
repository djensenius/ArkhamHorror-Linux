[tools]
cmake = "4.4.3"
ninja = "1.13.1"

[env]
BUILD_DIR = "build"

[tasks."setup:macos"]
description = "Install Qt development dependencies with Homebrew"
# NOTE: neither this Homebrew qtbase install nor the official Qt binaries
# CI uses (jurplel/install-qt-action) ship a real AVIF decode plugin --
# Qt has no official AVIF plugin at all (upstream qtimageformats does not
# include one). AssetNetworkFetcher's typed AssetErrorCode::UnsupportedCodec
# path (see src/AssetNetworkFetcher.cpp) is therefore the expected,
# permanent behavior for AVIF assets in local dev exactly as in CI, not a
# local-only gap; tests branch on QImageReader::supportedImageFormats()
# accordingly rather than assuming either outcome.
run = "brew install clang-format qtbase qtdeclarative qtshadertools qtsvg qtwebsockets"

[tasks.configure]
description = "Configure the Qt build"
run = '''
QT_PREFIX="${QT_PREFIX:-${QTDIR:-$(brew --prefix 2>/dev/null || true)}}"
cmake -S . -B "$BUILD_DIR" -G Ninja \
  ${QT_PREFIX:+-DCMAKE_PREFIX_PATH="$QT_PREFIX"} \
  -DCMAKE_BUILD_TYPE=Debug \
  -DBUILD_TESTING=ON
'''

[tasks.build]
description = "Build the application and tests"
depends = ["configure"]
run = "cmake --build \"$BUILD_DIR\" --parallel"

[tasks.test]
description = "Run headless foundation tests"
depends = ["build"]
env.QT_QPA_PLATFORM = "offscreen"
run = "ctest --test-dir \"$BUILD_DIR\" --output-on-failure"

[tasks."format:check"]
description = "Check C++ and QML formatting"
run = '''
clang-format --dry-run --Werror src/*.cpp src/*.h tests/*.cpp
for file in qml/*.qml; do
  formatted="$(mktemp)"
  qmlformat "$file" > "$formatted"
  if ! cmp -s "$file" "$formatted"; then
    echo "$file is not formatted; run: qmlformat -i $file" >&2
    rm -f "$formatted"
    exit 1
  fi
  rm -f "$formatted"
done
'''

[tasks.lint]
description = "Run QML static analysis"
depends = ["configure"]
run = "qmllint -I \"$BUILD_DIR\" qml/*.qml"

[tasks."package:appimage"]
description = "Build a Linux x86_64 AppImage"
depends = ["build"]
run = "packaging/build-appimage.sh \"$BUILD_DIR\""
