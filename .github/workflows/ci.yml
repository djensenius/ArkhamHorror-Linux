name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: 6.11.1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive.
          cache: true
      - name: Install formatter
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: mise run format:check

  lint:
    name: QML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive. Qt6::DBus (used by QtKeychain's Linux Secret Service backend) ships in the base qtbase archive, so no extra module is needed.
          cache: true
      - name: Install QtKeychain build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: mise run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive. Qt6::DBus (used by QtKeychain's Linux Secret Service backend) ships in the base qtbase archive, so no extra module is needed.
          cache: true
      - name: Install QtKeychain build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Install D-Bus (required by kwallet_hardening test's fake KWallet service)
        run: sudo apt-get update && sudo apt-get install -y dbus
      - run: mise run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive. Qt6::DBus (used by QtKeychain's Linux Secret Service backend) ships in the base qtbase archive, so no extra module is needed.
          cache: true
      - name: Install QtKeychain build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: mise run build

  appimage-smoke:
    name: AppImage smoke artifact
    runs-on: ubuntu-22.04
    needs:
      - format
      - lint
      - test
      - build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive. Qt6::DBus (used by QtKeychain's Linux Secret Service backend) ships in the base qtbase archive, so no extra module is needed.
          cache: true
      - name: Install QtKeychain build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Download packaging tools
        run: |
          curl --fail --location --retry 3 --output linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" \
            | sha256sum --check
          curl --fail --location --retry 3 --output linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          echo "15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage" \
            | sha256sum --check
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
      - name: Package
        env:
          LINUXDEPLOY: ${{ github.workspace }}/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_PLUGIN_QT: ${{ github.workspace }}/linuxdeploy-plugin-qt-x86_64.AppImage
        run: |
          mise run build
          mise run package:appimage
      - name: Verify libsecret and attribution files are bundled
        run: |
          set -euo pipefail
          appimage="$(ls -1 ./*.AppImage | head -n1)"
          [[ -n "$appimage" ]] || { echo "No AppImage produced." >&2; exit 1; }
          chmod +x "$appimage"
          # Extract the actual produced artifact (not just the AppDir staged
          # during packaging) so this proves what end users receive, not
          # merely what the build script intended to include.
          "./$appimage" --appimage-extract >/dev/null
          extracted=squashfs-root

          bundled_secret="$(find "$extracted" -name 'libsecret-1.so.0*' | head -n1)"
          [[ -n "$bundled_secret" ]] || {
            echo "libsecret-1.so.0 was not bundled into the AppImage." >&2
            exit 1
          }
          echo "Found bundled libsecret: $bundled_secret"

          keychain_lib="$(find "$extracted" -name 'libqt6keychain.so*' | head -n1)"
          [[ -n "$keychain_lib" ]] || {
            echo "libqt6keychain was not found inside the AppImage." >&2
            exit 1
          }

          # Prove the bundled libsecret actually resolves for the bundled
          # QtKeychain library via the same library search path AppRun uses
          # (usr/lib next to the executables), rather than merely being
          # present but unresolved/orphaned in the image.
          apprun_libdir="$extracted/usr/lib"
          ldd_output="$(LD_LIBRARY_PATH="$apprun_libdir" ldd "$keychain_lib")"
          if echo "$ldd_output" | grep -q 'not found'; then
            echo "libqt6keychain has unresolved dependencies inside the AppImage:" >&2
            echo "$ldd_output" >&2
            exit 1
          fi

          # A host copy must not be the one actually used: confirm the
          # resolved libsecret-1.so.0 path points inside the bundled
          # usr/lib, not a host system path such as
          # /usr/lib/x86_64-linux-gnu/libsecret-1.so.0 (the runner has a
          # host copy installed as a build dependency, so this genuinely
          # exercises whether the bundled copy -- not the host's -- is
          # what gets used).
          resolved_secret_line="$(echo "$ldd_output" | grep 'libsecret-1\.so\.0' || true)"
          [[ -n "$resolved_secret_line" ]] || {
            echo "libsecret-1.so.0 did not appear in libqt6keychain's resolved dependencies." >&2
            exit 1
          }
          echo "$resolved_secret_line" | grep -q -- "=> $apprun_libdir/" || {
            echo "libqt6keychain resolved libsecret-1.so.0 from outside the bundled AppDir:" >&2
            echo "$resolved_secret_line" >&2
            exit 1
          }

          license_path="$extracted/usr/share/doc/ArkhamHorror/third_party/qtkeychain/LICENSE"
          notice_path="$extracted/usr/share/doc/ArkhamHorror/third_party/qtkeychain/NOTICE.md"
          [[ -s "$license_path" ]] || {
            echo "QtKeychain LICENSE was not bundled at $license_path" >&2
            exit 1
          }
          [[ -s "$notice_path" ]] || {
            echo "QtKeychain NOTICE.md was not bundled at $notice_path" >&2
            exit 1
          }
          grep -q "BSD" "$license_path" || {
            echo "Bundled LICENSE does not look like the expected BSD-3-Clause text." >&2
            exit 1
          }
          echo "libsecret, libqt6keychain, and attribution files verified inside the AppImage."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ArkhamHorror-Linux-AppImage
          path: "*.AppImage"
          if-no-files-found: error
