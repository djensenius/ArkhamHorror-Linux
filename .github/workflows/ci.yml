name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: 6.11.1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive.
          cache: true
      - name: Install formatter
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: mise run format:check

  lint:
    name: QML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive. Qt6::DBus (used by QtKeychain's Linux Secret Service backend) ships in the base qtbase archive, so no extra module is needed.
          cache: true
      - name: Install QtKeychain, libavif and libjpeg build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config libavif-dev libjpeg-turbo8-dev zlib1g-dev # libavif-dev/libjpeg-turbo8-dev/zlib1g-dev: CMake's pkg_check_modules(LIBAVIF REQUIRED ...)/pkg_check_modules(LIBJPEG REQUIRED ...)/find_package(ZLIB REQUIRED) need these even for the configure-only lint job.
      - run: mise run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive. Qt6::DBus (used by QtKeychain's Linux Secret Service backend) ships in the base qtbase archive, so no extra module is needed. AVIF card art is decoded directly against libavif's own C API (see src/AssetAvifDecoder.cpp), and JPEG is decoded directly against libjpeg's own C API (see src/AssetJpegDecoder.cpp), neither through Qt's plugin registry -- Qt has no official AVIF plugin at all (upstream qtimageformats does not include one) -- so the codec-support tests exercise the real libavif/libjpeg-backed decode paths unconditionally rather than branching on QImageReader::supportedImageFormats().
          cache: true
      - name: Install QtKeychain, D-Bus, libavif, libjpeg and clang-format build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config dbus libavif-dev libjpeg-turbo8-dev zlib1g-dev clang-format # dbus is required by kwallet_hardening test's fake KWallet service; libavif-dev/libjpeg-turbo8-dev/zlib1g-dev provide the mandatory AVIF/JPEG decode and PNG IDAT-zlib-validation dependencies (CMake's pkg_check_modules(LIBAVIF REQUIRED ...)/pkg_check_modules(LIBJPEG REQUIRED ...)/find_package(ZLIB REQUIRED)); clang-format is required by generate_asset_locale_digest.py --check below (review round-6/7 item 10 -- --check fails closed without it, see that script's _clang_format()).
      - name: Test asset locale digest generator's --check fail-closed behavior
        # tools/generate_asset_locale_digest.py's --check mode (review
        # round-3 item 16) is a standalone local dev tool no CMake/ctest
        # target invokes, so its own regression suite
        # (tools/test_generate_asset_locale_digest.py, stdlib unittest
        # only -- no extra dependency) needs to be run here explicitly,
        # or a regression in --check's fail-closed behavior would go
        # uncaught by every other CI step.
        run: python3 tools/test_generate_asset_locale_digest.py
      - name: Test asset locale digest provenance verifier's fail-closed behavior
        # tools/verify_asset_locale_digest_provenance.py (review round-4
        # item 11) is itself only exercised offline against a mocked
        # GitHub API response here (tools/test_verify_asset_locale_digest_provenance.py),
        # so a regression in ITS OWN fail-closed logic (e.g. accepting a
        # renamed sourceRepository, a wrong git blob mode, or a missing
        # upstream blob) is caught before the real, network-dependent
        # verification step below ever runs.
        run: python3 tools/test_verify_asset_locale_digest_provenance.py
      - name: Verify asset locale digest provenance against real upstream commit
        # The actual live check (review round-4 item 11): fetches
        # halogenandtoast/ArkhamHorror's real Git Data API tree listing at
        # the exact commit contracts/asset-locale-digest.json pins, and
        # requires every pinned contracts/asset-locale-digest-sources/*.json
        # file to be a byte-for-byte identical git blob (by mode, path,
        # and content-addressed sha) to what that commit's real tree
        # actually contains -- rather than trusting the manifest's own
        # self-reported sha256/sourceCommit fields. GITHUB_TOKEN is used
        # only to raise this step's GitHub API rate limit; it is never
        # sent to, and grants no access on, the upstream repository being
        # verified (a public read-only Git Data API call). Any network
        # failure, missing commit/blob, or mismatch fails this step --
        # there is no fallback that lets a failed check pass silently.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/verify_asset_locale_digest_provenance.py
      - name: Verify generated asset locale digest header is not stale
        # Review round-6/7 item 10: previously CI only ran this script's
        # OWN unit tests (above) plus tests/AssetLocaleDigestTests.cpp's
        # independent C++ hash-drift check -- never the real
        # generate_asset_locale_digest.py --check itself against the
        # actual checked-in src/AssetLocaleDigestData.generated.h. That
        # left a gap: --check's own stronger drift detection (full
        # rendered-output comparison, not just embedded input hashes --
        # see review round-3 item 16's _clang_format()/fail-closed logic)
        # was never actually exercised in CI. clang-format is installed
        # above so --check's fail-closed-without-a-formatter path is
        # never spuriously triggered here.
        run: python3 tools/generate_asset_locale_digest.py --check
      - run: mise run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive. Qt6::DBus (used by QtKeychain's Linux Secret Service backend) ships in the base qtbase archive, so no extra module is needed.
          cache: true
      - name: Install QtKeychain and libavif build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config libavif-dev libjpeg-turbo8-dev zlib1g-dev
      - run: mise run build

  ubsan:
    name: UBSan (asset codecs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets
          cache: true
      - name: Install QtKeychain, libavif, libjpeg and zlib build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config libavif-dev libjpeg-turbo8-dev zlib1g-dev
      - name: Configure with ARKHAM_ENABLE_UBSAN in an optimized build
        # Cumulative-review finding (PR #18, exact head 4a47ea34): proves
        # AssetJpegDecoder.cpp's setjmp/longjmp-adjacent state handling
        # (and the rest of the asset codec/cache/coordinator paths this
        # binary exercises) under Clang's UndefinedBehaviorSanitizer in an
        # OPTIMIZED (RelWithDebInfo) build specifically -- see
        # CMakeLists.txt's ARKHAM_ENABLE_UBSAN option doc comment for why
        # an optimized build is the configuration most likely to actually
        # miscompile around setjmp()'s limited guarantees, versus the
        # normal -O0 Debug build every other CI job uses.
        run: |
          QT_PREFIX="${QT_PREFIX:-${QT_ROOT_DIR:-}}"
          cmake -S . -B build-ubsan -G Ninja \
            ${QT_PREFIX:+-DCMAKE_PREFIX_PATH="$QT_PREFIX"} \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON \
            -DARKHAM_ENABLE_UBSAN=ON
      - name: Build asset test binary under UBSan
        run: cmake --build build-ubsan --target arkham-asset-tests --parallel
      - name: Run asset tests under UBSan
        env:
          QT_QPA_PLATFORM: offscreen
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build-ubsan/arkham-asset-tests

  appimage-smoke:
    name: AppImage smoke artifact
    runs-on: ubuntu-22.04
    needs:
      - format
      - lint
      - test
      - build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive. Qt6::DBus (used by QtKeychain's Linux Secret Service backend) ships in the base qtbase archive, so no extra module is needed. JPEG/PNG imageformat plugins already ship in the base qtbase archive; AVIF is decoded directly against a bundled libavif (see src/AssetAvifDecoder.cpp) rather than through any Qt image-format plugin, so no Qt AVIF module is needed here either.
          cache: true
      - name: Install QtKeychain and libavif build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config libavif-dev libjpeg-turbo8-dev zlib1g-dev
      - name: Test libsecret discovery fallback logic
        # Exercises find_bundled_libsecret() (used by build-appimage.sh
        # below) against ldconfig-absent, ldconfig-failing,
        # ldconfig-succeeding, and nothing-found cases with fakes, so a
        # regression that reintroduces an unguarded pipeline aborting the
        # script under `set -euo pipefail` is caught here deterministically,
        # rather than only by this runner happening to have a working
        # ldconfig.
        run: bash packaging/tests/test_find_bundled_libsecret.sh
      - name: Test codec license/notice bundling logic
        # Exercises bundle_codec_notices() (used by build-appimage.sh
        # below, review round-3 item 17) against synthetic fake ".so"
        # files in a temporary directory: only-libavif, libavif plus
        # multiple codec backends, mandatory libavif missing (must fail,
        # no partial bundling), a recognized codec library present with
        # no corresponding notice source (must fail loudly rather than
        # silently ship unattributed), and bundled notice content
        # actually matching the checked-in third_party/ source. Hermetic
        # (no AppImage/network dependency).
        run: bash packaging/tests/test_bundle_codec_notices.sh
      - name: Test dependency-closure auditor against a synthetic ELF chain
        # Builds a small local three-library chain (root -> mid -> leaf)
        # with `cc`, then proves audit_dependency_closure.py: resolves a
        # complete closure, agrees between --list-only and human-readable
        # modes, fails and names the exact missing library/requester when
        # a real transitive dependency is deleted, never treats an
        # ABI-allowlisted library (libc.so.6) as missing even though it is
        # never present, and rejects a nonexistent root. This is hermetic
        # (no apt-get/network) and independent of the real
        # libsecret/libgpg-error closure exercised further below.
        #
        # Also covers --auto-roots (a synthetic nested plugin's own
        # dependency is invisible to a hand-picked --root list but is
        # discovered and resolved once auto-rooted -- and its deletion is
        # then correctly caught), --allow-x11-desktop-stack (a stub
        # libxcb.so.1 dependency is reported missing by default and only
        # resolves once the flag is explicitly given), and the recursive
        # index's ambiguous-duplicate-basename rejection.
        run: bash packaging/tests/test_audit_dependency_closure.sh
      - name: Test dependency-closure auditor's per-edge/RUNPATH logic
        # Portable (stdlib-only, no compiler/readelf/real ELF toolchain)
        # unit tests for audit_dependency_closure.py's internal
        # _effective_search_dirs()/audit_closure() logic (review round-9+
        # item 4): monkeypatches _readelf_dynamic_text() with fabricated
        # `readelf -d -W`-shaped text so the exact per-(name, requester)
        # edge reachability BFS, the external-RUNPATH-path rejection, and
        # the DT_RUNPATH-vs-DT_RPATH-vs-LD_LIBRARY_PATH precedence
        # ordering are all exercised deterministically -- runs on any
        # platform, complementing (never replacing) the Linux-only
        # synthetic-ELF-chain test above.
        run: python3 packaging/tests/test_audit_dependency_closure.py -v
      - name: Test the AVIF bundled round-trip smoke program in isolation
        # Hermetic (no AppImage/container/network dependency) proof that
        # packaging/tests/avif_bundled_roundtrip_smoke.c -- used later in
        # this job to prove the real packaged AppImage's bundled libavif
        # decodes with no host fallback -- is itself a correct,
        # deterministic encode/decode round trip against whatever libavif
        # this runner already has installed, before it is ever trusted
        # against the real produced AppImage.
        run: bash packaging/tests/test_avif_bundled_roundtrip_smoke.sh
      - name: Download packaging tools
        # Downloaded into $RUNNER_TEMP (outside the repository working
        # directory that "*.AppImage" globs below and in the upload step
        # match) so these tool executables can never be picked up by
        # those globs or bundled into the uploaded artifact alongside the
        # actual application AppImage.
        run: |
          mkdir -p "$RUNNER_TEMP/linuxdeploy-tools"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/linuxdeploy-tools/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $RUNNER_TEMP/linuxdeploy-tools/linuxdeploy-x86_64.AppImage" \
            | sha256sum --check
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/linuxdeploy-tools/linuxdeploy-plugin-qt-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          echo "15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  $RUNNER_TEMP/linuxdeploy-tools/linuxdeploy-plugin-qt-x86_64.AppImage" \
            | sha256sum --check
          chmod +x "$RUNNER_TEMP/linuxdeploy-tools/linuxdeploy-x86_64.AppImage" \
            "$RUNNER_TEMP/linuxdeploy-tools/linuxdeploy-plugin-qt-x86_64.AppImage"
      - name: Package
        env:
          LINUXDEPLOY: ${{ runner.temp }}/linuxdeploy-tools/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_PLUGIN_QT: ${{ runner.temp }}/linuxdeploy-tools/linuxdeploy-plugin-qt-x86_64.AppImage
        run: |
          mise run build
          mise run package:appimage
      - name: Verify exactly one application AppImage was produced
        # Now that the linuxdeploy tool executables are downloaded outside
        # the repository directory (see "Download packaging tools" above),
        # the only file this glob can ever match is the actual application
        # AppImage build-appimage.sh produced -- this assertion makes that
        # invariant explicit and catches any future regression (e.g. a tool
        # accidentally downloaded back into the repo root) before it could
        # silently bloat or alter the uploaded artifact's contents.
        run: |
          set -euo pipefail
          mapfile -t appimages < <(find . -maxdepth 1 -name '*.AppImage' -print)
          echo "Found ${#appimages[@]} AppImage(s) in the repository root:"
          printf '  %s\n' "${appimages[@]}"
          [[ ${#appimages[@]} -eq 1 ]] || {
            echo "Expected exactly one AppImage to upload, found ${#appimages[@]}." >&2
            exit 1
          }
          case "${appimages[0]}" in
            *linuxdeploy*)
              echo "The produced AppImage looks like a linuxdeploy tool, not the application: ${appimages[0]}" >&2
              exit 1
              ;;
          esac
      - name: Verify libsecret and attribution files are bundled
        run: |
          set -euo pipefail
          appimage="$(ls -1 ./*.AppImage | head -n1)"
          [[ -n "$appimage" ]] || { echo "No AppImage produced." >&2; exit 1; }
          chmod +x "$appimage"
          # Extract the actual produced artifact (not just the AppDir staged
          # during packaging) so this proves what end users receive, not
          # merely what the build script intended to include.
          "./$appimage" --appimage-extract >/dev/null
          extracted="$(pwd)/squashfs-root"

          # Defense-in-depth alongside the repo-root "exactly one AppImage"
          # assertion above: also prove the packaged AppDir itself never
          # embedded a linuxdeploy *tool executable* (e.g. via an accidental
          # future copy step), not just that one wasn't uploaded alongside
          # it. This must not flag `apprun-hooks/linuxdeploy-plugin-qt-
          # hook.sh`, a legitimate runtime hook script that linuxdeploy-
          # plugin-qt installs into every AppImage it produces (it sets up
          # Qt's own plugin/QML env vars at launch) -- it is named after the
          # plugin but is not the plugin/tool binary itself, so only ELF/
          # AppImage *binaries* matching the name are treated as a finding;
          # shell-script hooks are explicitly excluded.
          embedded_linuxdeploy=""
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -qE 'ELF|AppImage'; then
              embedded_linuxdeploy="$candidate"
              break
            fi
          done < <(find "$extracted" -iname '*linuxdeploy*' -type f -print0)
          [[ -z "$embedded_linuxdeploy" ]] || {
            echo "A linuxdeploy tool executable was embedded inside the AppImage: $embedded_linuxdeploy" >&2
            exit 1
          }

          bundled_secret="$(find "$extracted" -name 'libsecret-1.so.0*' | head -n1)"
          [[ -n "$bundled_secret" ]] || {
            echo "libsecret-1.so.0 was not bundled into the AppImage." >&2
            exit 1
          }
          echo "Found bundled libsecret: $bundled_secret"
          file "$bundled_secret" | grep -q 'ELF' || {
            echo "Bundled libsecret-1.so.0 is not a valid ELF shared object:" >&2
            file "$bundled_secret" >&2
            exit 1
          }

          keychain_lib="$(find "$extracted" -name 'libqt6keychain.so*' | head -n1)"
          [[ -n "$keychain_lib" ]] || {
            echo "libqt6keychain was not found inside the AppImage." >&2
            exit 1
          }

          # libqt6keychain does NOT link libsecret-1 as an ELF DT_NEEDED
          # dependency -- QtKeychain's libsecret.cpp loads it at runtime via
          # QLibrary (dlopen()), so `ldd libqt6keychain.so` never lists it,
          # bundled or not, and that check cannot be used to prove bundling.
          # See packaging/verify_bundled_libsecret.py for the real dlopen()
          # based proof this uses instead (it manages LD_LIBRARY_PATH
          # itself; no caller-side environment setup needed).
          python3 packaging/verify_bundled_libsecret.py "$bundled_secret"

          license_path="$extracted/usr/share/doc/ArkhamHorror/third_party/qtkeychain/LICENSE"
          notice_path="$extracted/usr/share/doc/ArkhamHorror/third_party/qtkeychain/NOTICE.md"
          [[ -s "$license_path" ]] || {
            echo "QtKeychain LICENSE was not bundled at $license_path" >&2
            exit 1
          }
          [[ -s "$notice_path" ]] || {
            echo "QtKeychain NOTICE.md was not bundled at $notice_path" >&2
            exit 1
          }
          # The upstream QtKeychain LICENSE text is the classic BSD-3-Clause
          # license but never contains the literal word "BSD"; match its
          # actual distinguishing clauses instead.
          grep -q "Redistribution and use in source and binary forms" "$license_path" \
            && grep -q "endorse or promote products derived from this software" "$license_path" || {
            echo "Bundled LICENSE does not look like the expected BSD-3-Clause text." >&2
            exit 1
          }
          echo "libsecret, libqt6keychain, and attribution files verified inside the AppImage."
      - name: Verify the JPEG image-format plugin is bundled and loadable
        # djensenius/ArkhamHorror-Linux#17's asset cache validates
        # Content-Type plus real magic bytes for PNG/JPEG/AVIF and decodes
        # via QImageReader. PNG decoding is compiled directly into QtGui
        # (no separate plugin), but JPEG decoding is a separate Qt plugin
        # (libqjpeg.so under .../plugins/imageformats/) that
        # linuxdeploy-plugin-qt must actually bundle for JPEG assets to
        # decode at all on a target host with no system Qt installed --
        # unlike libsecret above, this is a Qt plugin loaded via Qt's own
        # QFactoryLoader (scoped to the AppImage's own plugin path by
        # AppRun), not a bare dlopen(), so a simple presence + ELF-validity
        # check (mirroring the file-based half of the libsecret check) is
        # the right-sized proof here; the "Launch the packaged AppImage
        # headlessly" step below further proves the bundled Qt platform
        # plugin loads with no host Qt leakage using the exact same
        # plugin-path scoping mechanism.
        #
        # AVIF has no official Qt plugin at all as of this Qt release
        # (upstream qtimageformats does not ship one; a working plugin
        # would require the separate third-party
        # novomesk/qt-avif-image-plugin, out of scope here) -- but unlike
        # the earlier permanent-gap approach, this is not a problem: AVIF
        # card art is decoded directly against a bundled libavif via its
        # own C API (src/AssetAvifDecoder.cpp), bypassing Qt's plugin
        # registry (QImageReader/QFactoryLoader) entirely, so there is
        # deliberately no Qt AVIF *plugin* check here to assert against.
        # See the "Verify libavif and its codec backend closure are
        # bundled" and "Verify the bundled libavif decodes AVIF images
        # with no host codec fallback" steps below for the actual AVIF
        # proof.
        run: |
          set -euo pipefail
          extracted="$(pwd)/squashfs-root"
          jpeg_plugin="$(find "$extracted" -path '*/imageformats/libqjpeg.so' | head -n1)"
          [[ -n "$jpeg_plugin" ]] || {
            echo "libqjpeg.so was not bundled into the AppImage's imageformats plugin directory." >&2
            exit 1
          }
          echo "Found bundled JPEG plugin: $jpeg_plugin"
          file "$jpeg_plugin" | grep -q 'ELF' || {
            echo "Bundled libqjpeg.so is not a valid ELF shared object:" >&2
            file "$jpeg_plugin" >&2
            exit 1
          }
      - name: Verify libavif and its codec backend closure are bundled
        # AVIF card art (djensenius/ArkhamHorror-Linux#17) is decoded
        # directly against libavif's own C API (src/AssetAvifDecoder.cpp),
        # linked as an ordinary ELF DT_NEEDED dependency -- unlike
        # libsecret (loaded via dlopen()), linuxdeploy's default ldd-based
        # automatic bundling is expected to have picked up libavif.so and
        # its own transitive AV1 codec-backend dependencies (dav1d and/or
        # aom) on its own, with no explicit --library flag needed in
        # build-appimage.sh. This step proves that expectation against
        # the real produced AppImage rather than merely assuming it,
        # reusing the exact same host-independent recursive DT_NEEDED
        # closure auditor already proven against the libsecret closure
        # below (packaging/audit_dependency_closure.py), rooted at the
        # bundled libavif instead.
        run: |
          set -euo pipefail
          extracted="$(pwd)/squashfs-root"
          avif_lib="$(find "$extracted" -name 'libavif.so*' | head -n1)"
          [[ -n "$avif_lib" ]] || {
            echo "libavif.so was not bundled into the AppImage." >&2
            exit 1
          }
          echo "Found bundled libavif: $avif_lib"
          file "$avif_lib" | grep -q 'ELF' || {
            echo "Bundled libavif.so is not a valid ELF shared object:" >&2
            file "$avif_lib" >&2
            exit 1
          }
          avif_lib_dir="$(dirname "$avif_lib")"
          avif_name="$(basename "$avif_lib")"
          echo "Auditing the real bundled libavif closure (codec backends included)..."
          python3 packaging/audit_dependency_closure.py "$avif_lib_dir" --root "$avif_name"
      - name: Verify every bundled ELF library ships its required license notice
        # Review round-3 item 17 (initial version) / round-4 item 12 (this
        # rewrite): linuxdeploy's automatic ldd-based bundling has no
        # notion of license attribution at all, so nothing arranges for a
        # bundled library's required notice text to ship alongside the
        # bare .so files it copies -- and a small handwritten glob table
        # (the prior version of this step) can only ever check the
        # libraries its author happened to anticipate: round-4's own
        # cumulative review found the real produced AppImage additionally
        # bundling libjpeg and an entire family of libabsl_* (Abseil)
        # libraries with zero notice coverage, entirely undetected by the
        # old table.
        #
        # This step instead runs packaging/audit_codec_notices.py's
        # verify-notices mode against the REAL, final, already-extracted
        # AppImage (never the pre-packaging AppDir): it first recursively
        # classifies EVERY bundled .so* file under the extracted usr/lib
        # tree, hard-failing by exact path if even one cannot be resolved
        # to either the small ABI allowlist (needs no notice) or a known
        # third_party/<component>/ notice source -- so a brand-new,
        # never-before-seen bundled library (the exact class of defect
        # round-4 item 12 found) fails packaging here rather than
        # silently shipping unattributed. It then checksum-verifies every
        # checked-in third_party/<component>/* file is also present,
        # non-empty, and byte-for-byte identical under
        # usr/share/doc/ArkhamHorror/third_party/<component>/ in the
        # extracted AppImage -- proving genuine bundled *content*, not
        # merely a same-named file.
        run: |
          set -euo pipefail
          extracted="$(pwd)/squashfs-root"
          # linuxdeploy's exact library placement (usr/lib vs. a per-arch
          # subdirectory) is an implementation detail this must not
          # hard-code -- matching every other closure-related step in
          # this workflow, search the whole usr/ tree recursively rather
          # than assuming one fixed lib subdirectory.
          lib_search_root="$extracted/usr"
          [[ -d "$lib_search_root" ]] || {
            echo "Expected extracted AppImage usr/ directory not found: $lib_search_root" >&2
            exit 1
          }
          doc_root="$extracted/usr/share/doc/ArkhamHorror/third_party"

          # --qt-reference-dir anchors the classifier's Qt-plugin/QML
          # directory-based fallback to the ACTUAL Qt SDK installed for
          # this build ($QT_ROOT_DIR, exported by jurplel/install-qt-action
          # above): a later cumulative review found the previous,
          # directory-name-only fallback fail-open (an arbitrary .so
          # merely placed inside e.g. imageformats/ was silently accepted
          # as "qt"). With this argument, such a file is only classified
          # as "qt" if a file with the identical relative sub-path also
          # genuinely exists inside the pinned Qt SDK download itself.
          [[ -n "${QT_ROOT_DIR:-}" ]] || {
            echo "QT_ROOT_DIR is not set; install-qt-action should have exported it." >&2
            exit 1
          }

          sbom_path="$(pwd)/codec-notice-sbom.json"
          python3 packaging/audit_codec_notices.py classify "$lib_search_root" \
            --json-out "$sbom_path" --qt-reference-dir "$QT_ROOT_DIR"
          echo "Wrote machine-readable bundled-library SBOM to $sbom_path"

          python3 packaging/audit_codec_notices.py verify-notices \
            "$lib_search_root" third_party "$doc_root" --qt-reference-dir "$QT_ROOT_DIR"
      - name: Upload bundled-library SBOM
        uses: actions/upload-artifact@v4
        with:
          name: codec-notice-sbom
          path: codec-notice-sbom.json
          if-no-files-found: error
      - name: Verify the bundled libavif decodes AVIF images with no host codec fallback
        # Complementary to the static closure audit above (mirroring the
        # libsecret dlopen() no-host-fallback proof further below): builds
        # packaging/tests/avif_bundled_roundtrip_smoke.c -- a small,
        # self-contained program that encodes then decodes a tiny
        # synthetic (never official card art) in-memory AVIF image using
        # libavif's own C API, linked (`-lavif`) the same ordinary
        # ELF-dependency way the real application is -- then runs the
        # compiled binary inside a container built from
        # debian:bookworm-slim (pinned by digest, matching this repo's
        # policy of pinning external dependencies precisely; Debian
        # bookworm's own default package set does not include any libavif
        # package), mounting only the AppImage's extracted lib directory
        # (read-only) and setting LD_LIBRARY_PATH at container-start so
        # the dynamic linker is directed to the mounted bundled copy
        # first. A successful encode+decode round trip is only possible
        # if every one of libavif's own runtime dependencies -- the AV1
        # codec backend included -- was actually bundled and is genuinely
        # loadable, not merely present as an inert file.
        run: |
          set -euo pipefail
          extracted="$(pwd)/squashfs-root"
          avif_lib="$(find "$extracted" -name 'libavif.so*' | head -n1)"
          [[ -n "$avif_lib" ]] || {
            echo "libavif.so not found in the extracted AppImage." >&2
            exit 1
          }
          avif_lib_dir="$(dirname "$avif_lib")"
          cc packaging/tests/avif_bundled_roundtrip_smoke.c -o "$RUNNER_TEMP/avif_bundled_roundtrip_smoke" \
            $(pkg-config --cflags --libs libavif)
          docker run --rm \
            --env LD_LIBRARY_PATH=/appdir-lib \
            --volume "$avif_lib_dir:/appdir-lib:ro" \
            --volume "$RUNNER_TEMP/avif_bundled_roundtrip_smoke:/avif_bundled_roundtrip_smoke:ro" \
            debian@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171 \
            /avif_bundled_roundtrip_smoke
      - name: Recursive DT_NEEDED closure audit (with mutation regressions)
        # A static, purely file-based proof (packaging/audit_dependency_closure.py)
        # that every non-ABI transitive dependency of the bundled libsecret
        # (and libqt6keychain) closure is actually present inside the
        # AppImage's own AppDir lib directory, or is one of the small,
        # explicitly documented ABI_ALLOWLIST entries (the dynamic loader
        # and core glibc component libraries every glibc-based x86_64 Linux
        # host is guaranteed to already provide). Unlike a dlopen()-based
        # check (see the next step), this reads each bundled ELF's
        # DT_NEEDED entries via `readelf` and resolves them purely from the
        # filesystem, so it cannot be fooled into a false pass by whatever
        # shared libraries happen to already be installed/preloaded in
        # whatever environment runs it -- it is host-independent by
        # construction, not merely by container choice.
        #
        # This is exactly the check that would have caught this item's own
        # root cause (bundled libgcrypt.so.20 transitively requiring
        # libgpg-error.so.0, which linuxdeploy's default blacklist excludes
        # from automatic bundling): the mutation regressions below prove it
        # is not vacuously passing regardless of AppDir contents by
        # deleting real, representative non-ABI members of the actual
        # bundled closure (not a synthetic stand-in) and requiring the
        # audit to fail for each one.
        #
        # Mutation victims are chosen as: (1) libffi and (2) libgpg-error,
        # by explicit SONAME-prefix pattern (never a fixed exact version,
        # so a distro bump to e.g. libffi.so.9 is still matched) --
        # required by name because they are this item's own two concretely
        # documented real-world gaps (python:3.12-slim's own preloaded
        # libffi could otherwise mask a genuinely missing bundled copy, and
        # libgpg-error.so.0 was the actual missing dependency this whole
        # audit step was added to catch) -- plus (3) one further
        # representative non-ABI member chosen by a content-derived hash
        # index into the remaining closure members, not by taking the
        # alphabetically-first N entries (a "head -3" proxy would silently
        # keep re-testing the same few early-alphabet names forever and
        # never exercise the rest of the closure as it changes over time).
        run: |
          set -euo pipefail
          extracted="$(pwd)/squashfs-root"
          bundled_secret="$(find "$extracted" -name 'libsecret-1.so.0*' | head -n1)"
          [[ -n "$bundled_secret" ]] || {
            echo "libsecret-1.so.0 not found in the extracted AppImage." >&2
            exit 1
          }
          lib_dir="$(dirname "$bundled_secret")"
          keychain_name="$(find "$lib_dir" -maxdepth 1 -name 'libqt6keychain.so*' -printf '%f\n' | head -n1)"
          [[ -n "$keychain_name" ]] || {
            echo "libqt6keychain was not found alongside the bundled libsecret." >&2
            exit 1
          }

          echo "Auditing the real bundled closure..."
          python3 packaging/audit_dependency_closure.py "$lib_dir" \
            --root libsecret-1.so.0 --root "$keychain_name"

          # Enumerate the real closure members (excluding the two roots
          # above, which the audit script itself already requires to be
          # present) so the mutation targets below are always genuine,
          # currently-bundled, non-ABI dependencies -- never a hardcoded
          # filename that could silently stop matching after an unrelated
          # package version bump on the runner image.
          mapfile -t closure_members < <(
            python3 packaging/audit_dependency_closure.py "$lib_dir" \
              --root libsecret-1.so.0 --root "$keychain_name" --list-only \
              | grep -v -e '^libsecret-1\.so\.0$' -e "^${keychain_name}\$"
          )
          [[ ${#closure_members[@]} -ge 2 ]] || {
            echo "Expected at least two non-root closure members to mutate-test against, found ${#closure_members[@]}." >&2
            exit 1
          }
          echo "Real non-root closure members available for mutation testing: ${closure_members[*]}"

          # (1) and (2): libffi and libgpg-error MUST be present in the
          # real bundled closure and MUST be individually mutation-tested
          # by name -- these are this item's own two named, previously
          # under-tested (or, for libgpg-error, previously entirely
          # missing) dependencies. Matched by SONAME prefix, not an exact
          # pinned version string, so a future distro package bump (e.g.
          # libffi.so.8 -> libffi.so.9) is still matched and tested.
          libffi_name=""
          libgpgerror_name=""
          for member in "${closure_members[@]}"; do
            if [[ -z "$libffi_name" && "$member" == libffi.so.* ]]; then
              libffi_name="$member"
            fi
            if [[ -z "$libgpgerror_name" && "$member" == libgpg-error.so.* ]]; then
              libgpgerror_name="$member"
            fi
          done
          [[ -n "$libffi_name" ]] || {
            echo "Expected 'libffi.so.*' in the real bundled closure but did not find it: ${closure_members[*]}" >&2
            exit 1
          }
          [[ -n "$libgpgerror_name" ]] || {
            echo "Expected 'libgpg-error.so.*' in the real bundled closure but did not find it: ${closure_members[*]}" >&2
            exit 1
          }
          echo "Confirmed required mutation targets present: libffi='$libffi_name', libgpg-error='$libgpgerror_name'"

          # (3): one further representative non-ABI member, chosen by a
          # content-derived hash index into the remaining closure members
          # (i.e. excluding the two already covered above and the roots),
          # not by always picking the same alphabetically-early entries.
          # This selection shifts automatically whenever the underlying
          # dependency graph changes (e.g. a transitive dependency is
          # added, removed, or renamed across a distro/package update),
          # giving broader coverage over time than a fixed "head -N" proxy
          # while remaining fully deterministic for a given closure.
          remaining_members=()
          for member in "${closure_members[@]}"; do
            if [[ "$member" != "$libffi_name" && "$member" != "$libgpgerror_name" ]]; then
              remaining_members+=("$member")
            fi
          done
          extra_victim=""
          if [[ ${#remaining_members[@]} -gt 0 ]]; then
            hash_hex="$(printf '%s\n' "${remaining_members[@]}" | sha256sum | cut -c1-8)"
            extra_idx=$(( 16#$hash_hex % ${#remaining_members[@]} ))
            extra_victim="${remaining_members[$extra_idx]}"
            echo "Additional dynamically-selected mutation target: '$extra_victim' (index $extra_idx of ${#remaining_members[@]})"
          else
            echo "No further non-ABI closure members remain beyond libffi/libgpg-error; skipping the additional representative-member mutation."
          fi

          victims=("$libffi_name" "$libgpgerror_name")
          [[ -n "$extra_victim" ]] && victims+=("$extra_victim")

          scratch="$(mktemp -d)"
          audit_output="$(mktemp)"
          trap 'rm -rf "$scratch" "$audit_output"' EXIT
          for victim in "${victims[@]}"; do
            rm -rf "${scratch:?}"/*
            cp -a "$lib_dir/." "$scratch/"
            rm -f "$scratch/$victim"
            if python3 packaging/audit_dependency_closure.py "$scratch" \
              --root libsecret-1.so.0 --root "$keychain_name" >"$audit_output" 2>&1; then
              echo "Expected the closure audit to fail after removing '$victim', but it passed:" >&2
              cat "$audit_output" >&2
              exit 1
            fi
            grep -q -- "$victim" "$audit_output" || {
              echo "Closure audit failed after removing '$victim' as expected, but did not name it as missing:" >&2
              cat "$audit_output" >&2
              exit 1
            }
            echo "Confirmed: removing bundled '$victim' correctly fails the closure audit."
          done
      - name: Exhaustive recursive DT_NEEDED closure audit (every bundled ELF as root)
        # Review round-4/item 11: the closure audit above (and the AVIF/
        # libavif-rooted audit further above) only ever starts from a
        # small, hand-picked --root list (libsecret-1.so.0,
        # libqt6keychain.so, libavif.so). Neither the app's own executable
        # nor any Qt plugin (e.g. the xcb platform plugin,
        # usr/lib/plugins/platforms/libqxcb.so) or QML module is
        # transitively reachable from those roots at all, so a missing
        # bundled dependency needed only by one of *them* (concretely:
        # base libxcb.so.1, needed by libqxcb.so, which linuxdeploy's own
        # default blacklist does not auto-bundle) was invisible to every
        # existing closure-audit step. Compounding this, the existing
        # "Launch the packaged AppImage headlessly" smoke test below uses
        # QT_QPA_PLATFORM=offscreen, which loads libqoffscreen.so instead
        # of libqxcb.so, so the real xcb platform-plugin load path (and
        # its need for libxcb.so.1) was never actually exercised at
        # runtime either -- offscreen smoke masked the gap.
        #
        # This step closes both gaps statically: --auto-roots recursively
        # discovers and roots the walk at literally every real ELF file
        # under the whole extracted usr/ tree (the app executable in
        # usr/bin, every already-verified library in usr/lib, every Qt
        # plugin under usr/lib/plugins/**, and every QML module under
        # usr/qml/**), so nothing bundled can have an unaudited
        # dependency purely because no hand-picked --root list happened to
        # reach it.
        #
        # Base X11/xcb/xkbcommon/GL-EGL client libraries and the host's own
        # fontconfig/FreeType font-rendering stack are the two deliberate,
        # explicitly documented exceptions (X11_DESKTOP_ABI_ALLOWLIST and
        # FONT_RENDERING_ABI_ALLOWLIST in audit_dependency_closure.py,
        # opted into here via --allow-x11-desktop-stack and
        # --allow-font-rendering-stack respectively): matching
        # linuxdeploy's own default blacklist convention (verified via
        # linuxdeploy's public documentation: base X11/xcb libraries are
        # treated as "always already present on the target", the same
        # category as glibc, precisely because bundling a
        # possibly-mismatched xcb/X11 stack alongside a *different* host
        # X server/XWayland compositor -- including SteamOS's Gamescope --
        # can break in the opposite, non-obvious direction: protocol/ABI
        # skew between client and server; and directly confirmed against a
        # real linuxdeploy run's own "Skipping deployment of blacklisted
        # library" diagnostic for libfontconfig.so.1/libfreetype.so.6:
        # bundling one's own fontconfig/FreeType is a well-known
        # font-cache/config-path compatibility hazard distinct from an ABI
        # guarantee), these are intentionally NOT bundled and are asserted,
        # by exact name, to be host-provided. This was previously an
        # unstated, inconsistent assumption (this same workflow already
        # `apt-get install`s libxkbcommon0/libgl1/libopengl0/libegl1 *and*
        # fontconfig/fonts-dejavu-core into the offscreen-smoke container
        # below specifically because they are assumed host-provided) --
        # this step makes it complete and auditable in one explicit place
        # rather than leaving new gaps in the same category undetected.
        run: |
          set -euo pipefail
          extracted="$(pwd)/squashfs-root"
          usr_root="$extracted/usr"
          [[ -d "$usr_root" ]] || {
            echo "Expected extracted AppImage usr/ directory not found: $usr_root" >&2
            exit 1
          }
          echo "Auditing the exhaustive closure of every real bundled ELF under $usr_root ..."
          # --global-search-dir "$usr_root/lib" mirrors this project's real
          # AppRun-exported LD_LIBRARY_PATH: it is searched for every
          # bundled object's dependency edges regardless of that object's
          # own RUNPATH/RPATH. Without it, only $ORIGIN-relative entries
          # patchelf/linuxdeploy actually wrote onto each individual
          # bundled ELF (not usr_root itself, which is never a real
          # load-time search directory) would be honored -- see
          # audit_dependency_closure.py's loader-search-awareness design.
          python3 packaging/audit_dependency_closure.py "$usr_root" \
            --auto-roots "$usr_root" \
            --global-search-dir "$usr_root/lib" \
            --allow-x11-desktop-stack \
            --allow-font-rendering-stack
      - name: Verify bundled libsecret dependency closure has no host fallback
        # The static recursive closure audit above is the primary,
        # host-independent proof that every non-ABI transitive dependency
        # is actually bundled. This step is a complementary, secondary
        # proof that the *dynamic* resolution mechanism (dlopen(), as
        # QtKeychain's libsecret backend actually uses at runtime) also
        # resolves everything from the bundled copies when scoped via
        # LD_LIBRARY_PATH -- but note its own limitation honestly: the
        # python:3.12-slim-bookworm image below does not have
        # libsecret-1-0 itself installed, yet may still ship some of the
        # same transitive libraries the CPython interpreter itself links
        # against (e.g. libffi, zlib), so a broken bundling could in
        # principle still partially resolve via the container image's own
        # libraries rather than the mounted AppDir. The static audit above
        # does not share this limitation (it never depends on what the
        # auditing environment itself happens to already have installed),
        # which is why it -- not this step -- is treated as the
        # authoritative proof of full closure completeness; this step adds
        # confidence that the bundled files are also genuinely loadable via
        # the real dlopen() code path, not merely present as inert files.
        #
        # This step re-runs the exact same production dlopen check
        # (packaging/verify_bundled_libsecret.py, unmodified) inside a
        # container built from python:3.12-slim-bookworm. Only the
        # extracted AppImage's usr/lib directory is mounted in (read-only)
        # and LD_LIBRARY_PATH is set at container-start (i.e. from process
        # start, matching the requirement documented in
        # verify_bundled_libsecret.py's docstring), so the dynamic linker
        # is directed to the mounted AppDir copy first. This was verified
        # locally during development by deliberately removing a bundled
        # transitive dependency from a synthetic AppDir and confirming this
        # exact check then fails with an explicit "cannot open shared
        # object file" error rather than passing.
        #
        # The image is pinned by digest, per repo policy of pinning
        # external dependencies precisely.
        run: |
          set -euo pipefail
          extracted="$(pwd)/squashfs-root"
          bundled_secret="$(find "$extracted" -name 'libsecret-1.so.0*' | head -n1)"
          [[ -n "$bundled_secret" ]] || {
            echo "libsecret-1.so.0 not found in the extracted AppImage." >&2
            exit 1
          }
          lib_dir="$(dirname "$bundled_secret")"
          docker run --rm \
            --volume "$lib_dir:/appdir-lib:ro" \
            --volume "$(pwd)/packaging/verify_bundled_libsecret.py:/verify.py:ro" \
            python@sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579 \
            python3 /verify.py "/appdir-lib/$(basename "$bundled_secret")"
      - name: Launch the packaged AppImage headlessly to verify real startup
        # Runs the extracted AppRun (with the app's own --smoke-test flag,
        # see src/main.cpp) inside a container built from
        # debian:bookworm-slim, an image that -- like the dependency-closure
        # check above -- never has libsecret-1-0 or its glib/gio/gobject
        # dependency stack preinstalled. Only fontconfig, a concrete font
        # package, libxkbcommon0, libgl1, libopengl0, and libegl1 are added
        # on top (verified locally during development to pull in none of
        # libsecret/glib/gobject/gio transitively) so Qt Quick's offscreen
        # QPA platform plugin can actually initialize text layout and
        # keymaps. QT_QUICK_BACKEND=software selects Qt Quick's raster
        # scenegraph adaptation so no GPU/EGL context is ever created at
        # runtime, but libGLX.so.0/libGL.so.1/libOpenGL.so.0/libEGL.so.1
        # are still required because Qt's Gui/OpenGL support libraries are
        # ELF-linked (DT_NEEDED) against them regardless of which backend
        # is selected at runtime -- the dynamic loader resolves DT_NEEDED
        # libraries at load time even for symbols never actually called,
        # so omitting any of them fails AppRun's own dynamic linking before
        # Qt code ever runs (confirmed in CI iteration: omitting libgl1
        # reproduced "libGLX.so.0: cannot open shared object file", and
        # omitting libopengl0 then reproduced the equivalent error for
        # libOpenGL.so.0). This both proves genuine Qt/QML/plugin startup
        # (not merely that the binary exists) and reinforces that the
        # bundled libsecret closure is what a real run actually resolves,
        # not a host fallback.
        #
        # --smoke-test runs full, unmodified QGuiApplication /
        # QQmlApplicationEngine / plugin initialization and the existing
        # rootObjects().isEmpty() failure check, then enters the real Qt
        # event loop (app.exec()) and exits 0 only once the root
        # QQuickWindow has actually rendered and swapped its first
        # scenegraph frame (QQuickWindow::frameSwapped()); an internal
        # 20-second deadline (src/main.cpp's kSmokeTestDeadlineMs) exits
        # non-zero if no frame renders in time. A QML/plugin/rendering
        # failure or hang therefore always causes a non-zero exit from
        # this process itself -- CI never has to infer success from an
        # external timeout. The `timeout 60` below is only a defensive
        # backstop against something outside the app's own control (e.g.
        # a container/runtime hang); a timeout's non-zero (124) exit still
        # fails the step under `set -euo pipefail` like any other error --
        # it is never treated as a substitute for the app's own real
        # first-frame success signal.
        #
        # The image is pinned by digest, per repo policy of pinning
        # external dependencies precisely.
        run: |
          set -euo pipefail
          extracted="$(pwd)/squashfs-root"
          [[ -x "$extracted/AppRun" ]] || {
            echo "AppRun not found or not executable in the extracted AppImage." >&2
            exit 1
          }
          docker run --rm \
            --env QT_QPA_PLATFORM=offscreen \
            --env QT_QUICK_BACKEND=software \
            --volume "$extracted:/app:ro" \
            debian@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171 \
            bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                fontconfig fonts-dejavu-core libxkbcommon0 libgl1 \
                libopengl0 libegl1 >/dev/null
              timeout 60 /app/AppRun --smoke-test
            '
          echo "AppImage launched, entered the event loop, and rendered its first QML frame successfully in a minimal headless container."
      - name: Launch the packaged AppImage under a real xcb display (Gaming Mode startup smoke)
        # Review round-4/item 11: the offscreen smoke test above proves
        # genuine Qt/QML startup, but QT_QPA_PLATFORM=offscreen loads
        # libqoffscreen.so, never libqxcb.so -- so it never actually
        # exercises the real xcb platform-plugin path a genuine desktop
        # session (including SteamOS's Gamescope, an XWayland-backed
        # compositor Qt's xcb plugin connects to exactly like any other
        # X11 display) uses at runtime, and could not have caught a
        # missing base-libxcb-style gap by itself.
        #
        # This step launches the same unmodified AppRun --smoke-test
        # binary with QT_QPA_PLATFORM=xcb against a genuine (virtual) X11
        # server (Xvfb), inside the same kind of intentionally
        # libsecret/glib-less debian:bookworm-slim container used above --
        # "without host leakage" here means this container never has the
        # bundled Qt/app libraries themselves preinstalled (so a real
        # startup failure cannot be masked by a host copy silently
        # substituting for a broken bundle), while the base X11/xcb/GL
        # client libraries it does install are the one deliberate,
        # explicitly-documented exception (X11_DESKTOP_ABI_ALLOWLIST in
        # audit_dependency_closure.py): this project's own policy is that
        # those specific libraries are always host/session-provided, never
        # bundled, so installing them here to provide a genuine X11
        # session is the correct simulation of a real target host/Gamescope
        # session, not a leak that could hide a real defect in anything
        # this project actually bundles.
        #
        # QT_QUICK_BACKEND is deliberately left unset here (unlike the
        # offscreen step above): a real xcb session is expected to
        # negotiate a real GL context via the bundled libGL/libEGL
        # dispatch libraries against the container's host-provided GL
        # implementation (Mesa's software llvmpipe rasterizer, installed
        # below), proving the actual production startup path end users
        # will exercise, not an alternate raster-only code path.
        run: |
          set -euo pipefail
          extracted="$(pwd)/squashfs-root"
          [[ -x "$extracted/AppRun" ]] || {
            echo "AppRun not found or not executable in the extracted AppImage." >&2
            exit 1
          }
          docker run --rm \
            --volume "$extracted:/app:ro" \
            debian@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171 \
            bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                xvfb xauth \
                libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
                libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
                libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
                libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 \
                fontconfig fonts-dejavu-core \
                libgl1 libopengl0 libegl1 libgl1-mesa-dri >/dev/null
              Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
              xvfb_pid=$!
              trap "kill $xvfb_pid 2>/dev/null || true" EXIT
              for _ in $(seq 1 50); do
                [[ -e /tmp/.X11-unix/X99 ]] && break
                sleep 0.1
              done
              [[ -e /tmp/.X11-unix/X99 ]] || {
                echo "Xvfb did not create its display socket in time." >&2
                exit 1
              }
              export DISPLAY=:99
              export QT_QPA_PLATFORM=xcb
              timeout 60 /app/AppRun --smoke-test
