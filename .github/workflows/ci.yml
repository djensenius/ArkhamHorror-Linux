name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: 6.11.1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive.
          cache: true
      - name: Install formatter
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: mise run format:check

  lint:
    name: QML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive. Qt6::DBus (used by QtKeychain's Linux Secret Service backend) ships in the base qtbase archive, so no extra module is needed.
          cache: true
      - name: Install QtKeychain build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: mise run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive. Qt6::DBus (used by QtKeychain's Linux Secret Service backend) ships in the base qtbase archive, so no extra module is needed.
          cache: true
      - name: Install QtKeychain and D-Bus build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config dbus # dbus is required by kwallet_hardening test's fake KWallet service
      - run: mise run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive. Qt6::DBus (used by QtKeychain's Linux Secret Service backend) ships in the base qtbase archive, so no extra module is needed.
          cache: true
      - name: Install QtKeychain build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: mise run build

  appimage-smoke:
    name: AppImage smoke artifact
    runs-on: ubuntu-22.04
    needs:
      - format
      - lint
      - test
      - build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets # Qt Quick and QuickControls2 ship in the base archive. Qt6::DBus (used by QtKeychain's Linux Secret Service backend) ships in the base qtbase archive, so no extra module is needed.
          cache: true
      - name: Install QtKeychain build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Test libsecret discovery fallback logic
        # Exercises find_bundled_libsecret() (used by build-appimage.sh
        # below) against ldconfig-absent, ldconfig-failing,
        # ldconfig-succeeding, and nothing-found cases with fakes, so a
        # regression that reintroduces an unguarded pipeline aborting the
        # script under `set -euo pipefail` is caught here deterministically,
        # rather than only by this runner happening to have a working
        # ldconfig.
        run: bash packaging/tests/test_find_bundled_libsecret.sh
      - name: Download packaging tools
        run: |
          curl --fail --location --retry 3 --output linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" \
            | sha256sum --check
          curl --fail --location --retry 3 --output linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          echo "15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage" \
            | sha256sum --check
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
      - name: Package
        env:
          LINUXDEPLOY: ${{ github.workspace }}/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_PLUGIN_QT: ${{ github.workspace }}/linuxdeploy-plugin-qt-x86_64.AppImage
        run: |
          mise run build
          mise run package:appimage
      - name: Verify libsecret and attribution files are bundled
        run: |
          set -euo pipefail
          appimage="$(ls -1 ./*.AppImage | head -n1)"
          [[ -n "$appimage" ]] || { echo "No AppImage produced." >&2; exit 1; }
          chmod +x "$appimage"
          # Extract the actual produced artifact (not just the AppDir staged
          # during packaging) so this proves what end users receive, not
          # merely what the build script intended to include.
          "./$appimage" --appimage-extract >/dev/null
          extracted="$(pwd)/squashfs-root"

          bundled_secret="$(find "$extracted" -name 'libsecret-1.so.0*' | head -n1)"
          [[ -n "$bundled_secret" ]] || {
            echo "libsecret-1.so.0 was not bundled into the AppImage." >&2
            exit 1
          }
          echo "Found bundled libsecret: $bundled_secret"
          file "$bundled_secret" | grep -q 'ELF' || {
            echo "Bundled libsecret-1.so.0 is not a valid ELF shared object:" >&2
            file "$bundled_secret" >&2
            exit 1
          }

          keychain_lib="$(find "$extracted" -name 'libqt6keychain.so*' | head -n1)"
          [[ -n "$keychain_lib" ]] || {
            echo "libqt6keychain was not found inside the AppImage." >&2
            exit 1
          }

          # libqt6keychain does NOT link libsecret-1 as an ELF DT_NEEDED
          # dependency -- QtKeychain's libsecret.cpp loads it at runtime via
          # QLibrary (dlopen()), so `ldd libqt6keychain.so` never lists it,
          # bundled or not, and that check cannot be used to prove bundling.
          # See packaging/verify_bundled_libsecret.py for the real dlopen()
          # based proof this uses instead (it manages LD_LIBRARY_PATH
          # itself; no caller-side environment setup needed).
          python3 packaging/verify_bundled_libsecret.py "$bundled_secret"

          license_path="$extracted/usr/share/doc/ArkhamHorror/third_party/qtkeychain/LICENSE"
          notice_path="$extracted/usr/share/doc/ArkhamHorror/third_party/qtkeychain/NOTICE.md"
          [[ -s "$license_path" ]] || {
            echo "QtKeychain LICENSE was not bundled at $license_path" >&2
            exit 1
          }
          [[ -s "$notice_path" ]] || {
            echo "QtKeychain NOTICE.md was not bundled at $notice_path" >&2
            exit 1
          }
          # The upstream QtKeychain LICENSE text is the classic BSD-3-Clause
          # license but never contains the literal word "BSD"; match its
          # actual distinguishing clauses instead.
          grep -q "Redistribution and use in source and binary forms" "$license_path" \
            && grep -q "endorse or promote products derived from this software" "$license_path" || {
            echo "Bundled LICENSE does not look like the expected BSD-3-Clause text." >&2
            exit 1
          }
          echo "libsecret, libqt6keychain, and attribution files verified inside the AppImage."
      - name: Verify bundled libsecret dependency closure has no host fallback
        # The previous step's dlopen check runs directly on this
        # ubuntu-22.04 runner, which -- like any environment used to build
        # QtKeychain -- has libsecret-1-dev (and its glib/gio/gobject/
        # gcrypt/pcre2/... dependency stack) installed as a system package
        # (see "Install QtKeychain build dependencies" above). That means a
        # *broken* bundling (e.g. a missing transitive dependency inside
        # AppDir) could still silently resolve via the runner's own system
        # libraries, so passing there does not by itself prove the
        # AppImage is self-sufficient.
        #
        # This step re-runs the exact same production dlopen check
        # (packaging/verify_bundled_libsecret.py, unmodified) inside a
        # container built from python:3.12-slim-bookworm, an image that
        # never has libsecret-1-0 or any of its glib/gio/gobject/gcrypt/
        # pcre2/... dependency stack installed and ships only glibc plus
        # the CPython runtime. Only the extracted AppImage's usr/lib
        # directory is mounted in (read-only) and LD_LIBRARY_PATH is set at
        # container-start (i.e. from process start, matching the
        # requirement documented in verify_bundled_libsecret.py's
        # docstring), so the dynamic linker can only satisfy libsecret's
        # transitive shared library dependencies from that mounted AppDir
        # copy or from the small glibc/ld-linux baseline every Linux
        # container ships with -- there is no host libsecret/glib fallback
        # available at all inside this container. If any non-ABI
        # transitive dependency (glib, gobject, gio, gcrypt, pcre2, ffi,
        # ...) were missing from AppDir, dlopen() fails outright here with
        # no possibility of a silent host fallback -- this was verified
        # locally during development by deliberately removing a bundled
        # transitive dependency from a synthetic AppDir and confirming this
        # exact check then fails with an explicit "cannot open shared
        # object file" error rather than passing.
        #
        # The image is pinned by digest, per repo policy of pinning
        # external dependencies precisely.
        run: |
          set -euo pipefail
          extracted="$(pwd)/squashfs-root"
          bundled_secret="$(find "$extracted" -name 'libsecret-1.so.0*' | head -n1)"
          [[ -n "$bundled_secret" ]] || {
            echo "libsecret-1.so.0 not found in the extracted AppImage." >&2
            exit 1
          }
          lib_dir="$(dirname "$bundled_secret")"
          docker run --rm \
            --volume "$lib_dir:/appdir-lib:ro" \
            --volume "$(pwd)/packaging/verify_bundled_libsecret.py:/verify.py:ro" \
            python@sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579 \
            python3 /verify.py "/appdir-lib/$(basename "$bundled_secret")"
      - name: Launch the packaged AppImage headlessly to verify real startup
        # Runs the extracted AppRun (with the app's own --smoke-test flag,
        # see src/main.cpp) inside a container built from
        # debian:bookworm-slim, an image that -- like the dependency-closure
        # check above -- never has libsecret-1-0 or its glib/gio/gobject
        # dependency stack preinstalled. Only fontconfig, a concrete font
        # package, libxkbcommon0, and libgl1 are added on top (verified
        # locally during development to pull in none of libsecret/glib/
        # gobject/gio transitively) so Qt Quick's offscreen QPA platform
        # plugin can actually initialize text layout and keymaps.
        # QT_QUICK_BACKEND=software selects Qt Quick's raster scenegraph
        # adaptation so no GPU/EGL context is ever created at runtime, but
        # libgl1 (providing libGLX.so.0/libGL.so.1) is still required
        # because Qt's Gui/OpenGL support libraries are ELF-linked
        # (DT_NEEDED) against libGLX regardless of which backend is
        # selected at runtime -- the dynamic loader resolves DT_NEEDED
        # libraries at load time even for symbols never actually called,
        # so omitting it fails AppRun's own dynamic linking before Qt code
        # ever runs (confirmed locally: omitting libgl1 here reproduces the
        # exact "libGLX.so.0: cannot open shared object file" error seen in
        # CI without it). This both proves genuine Qt/QML/plugin startup
        # (not merely that the binary exists) and reinforces that the
        # bundled libsecret closure is what a real run actually resolves,
        # not a host fallback.
        #
        # --smoke-test runs full, unmodified QGuiApplication /
        # QQmlApplicationEngine / plugin initialization and the existing
        # rootObjects().isEmpty() failure check, only skipping app.exec();
        # it exits 0 solely once a QML root object was actually created. A
        # QML/plugin/startup error therefore causes a non-zero exit and
        # this step to fail. `timeout` is used only as a defensive backstop
        # against an unrelated hang; a timeout's non-zero (124) exit still
        # fails the step under `set -euo pipefail` like any other error --
        # it is never treated as a substitute for success.
        #
        # The image is pinned by digest, per repo policy of pinning
        # external dependencies precisely.
        run: |
          set -euo pipefail
          extracted="$(pwd)/squashfs-root"
          [[ -x "$extracted/AppRun" ]] || {
            echo "AppRun not found or not executable in the extracted AppImage." >&2
            exit 1
          }
          docker run --rm \
            --env QT_QPA_PLATFORM=offscreen \
            --env QT_QUICK_BACKEND=software \
            --volume "$extracted:/app:ro" \
            debian@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171 \
            bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                fontconfig fonts-dejavu-core libxkbcommon0 libgl1 >/dev/null
              timeout 60 /app/AppRun --smoke-test
            '
          echo "AppImage launched and created a QML root object successfully in a minimal headless container."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ArkhamHorror-Linux-AppImage
          path: "*.AppImage"
          if-no-files-found: error
